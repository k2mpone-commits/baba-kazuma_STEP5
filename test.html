<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEP5テスト</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 背景色を変更するボタン -->
      <button id="change-btn">背景色を変更</button>
      <div class="input-area">
        <!-- テキスト入力欄 -->
        <input type="text" id="text-input" placeholder="テキストを入力" />
        <!-- 「表示」ボタン -->
        <button id="show-btn">表示</button>
        <!-- 「追加」ボタン -->
        <button id="add-btn">追加</button>
      </div>
      <!-- ーテキスト表示エリア -->
      <div id="display-area" class="display-area">表示エリア</div>
      <!-- 行数カウント表示 -->
      <div id="row-count-display">
        現在の行数：<span id="row-count">0</span>
      </div>
      <!-- データテーブル -->
      <table id="data-table">
        <thead>
          <tr>
            <th>内容</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </body>
</html>
